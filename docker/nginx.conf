worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ── Gzip ─────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Server ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ── Security headers ─────────────────────────────────
        add_header X-Frame-Options         "SAMEORIGIN"      always;
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-XSS-Protection        "1; mode=block"   always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # ── Cache rules ──────────────────────────────────────
        # Immutable cache for hashed Next.js static assets
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Short cache for HTML pages
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }

        # Fonts & images
        location ~* \.(?:ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location ~* \.(?:png|jpe?g|gif|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # RSC payload files (Next.js client-side navigation)
        location ~* __next\..*\.txt$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            add_header Content-Type "text/plain";
        }

        # ── Routing ───────────────────────────────────────────
        # Redirect /en -> /en/ (preserve trailing slash convention)
        # Only redirect if the trailing-slash directory actually exists
        rewrite ^/([^.]*[^/])$ /$1/ permanent;

        # Try the exact URI, then directory/index.html, then 404
        location / {
            try_files $uri $uri/index.html /404.html;
        }

        # ── Error pages ───────────────────────────────────────
        error_page 404 /404.html;
        location = /404.html {
            internal;
            expires 30s;
        }

        # ── Deny hidden files ─────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
